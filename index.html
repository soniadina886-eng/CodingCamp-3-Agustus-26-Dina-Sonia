<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <!-- Memanggil CSS sesuai folder Rules (huruf kecil) -->
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense & Budget Visualizer</h1>
            <!-- Optional Challenge 1: Dark Mode Toggle -->
            <button id="theme-toggle">🌙 Dark Mode</button>
        </header>

        <div class="balance-card">
            <h3>TOTAL BALANCE</h3>
            <div id="total-balance">$0.00</div>
        </div>

        <section class="form-section">
            <h2>Add Transaction</h2>
            <form id="transaction-form">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="item-name" placeholder="e.g. Cilok" required>
                </div>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" step="0.01" id="amount" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>
                <button type="submit" id="add-btn">Add Transaction</button>
            </form>
        </section>

        <div class="main-grid">
            <section class="list-section">
                <div class="list-header">
                    <h2>Transactions</h2>
                    <!-- Optional Challenge 2: Sort Transactions -->
                    <select id="sort-select">
                        <option value="newest">Newest First</option>
                        <option value="high-amount">Highest Amount</option>
                        <option value="low-amount">Lowest Amount</option>
                    </select>
                </div>
                <div id="transaction-list"></div>
            </section>

            <section class="chart-section">
                <h2>Spending by Category</h2>
                <div class="chart-container">
                    <canvas id="expense-chart"></canvas>
                </div>
            </section>
        </div>
    </div>

    <!-- Memanggil JS sesuai folder Rules (huruf kecil) -->
    <script src="js/script.js"></script>
</body>
</html>
