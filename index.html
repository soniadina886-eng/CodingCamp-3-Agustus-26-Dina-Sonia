<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense & Budget Visualizer</h1>
            <button id="theme-toggle" class="btn-secondary">🌙 Dark Mode</button>
        </header>

        <!-- Balance Card -->
        <div class="balance-card">
            <h3>TOTAL BALANCE</h3>
            <div id="total-balance" class="balance-amount">$0.00</div>
        </div>

        <!-- Add Transaction Form -->
        <section class="form-section">
            <h2>Add Transaction</h2>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" placeholder="e.g. Cilok" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Add Transaction</button>
            </form>
        </section>

        <!-- Main Content Grid -->
        <div class="main-grid">
            <!-- Transactions List Section -->
            <section class="list-section">
                <div class="list-header">
                    <h2>Transactions</h2>
                    <!-- Challenge 1: Sorting -->
                    <select id="sort-select">
                        <option value="newest">Newest First</option>
                        <option value="high-amount">Highest Amount</option>
                        <option value="low-amount">Lowest Amount</option>
                    </select>
                </div>
                
                <div id="transaction-list" class="transaction-list">
                    <!-- Dynamic items inserted here -->
                </div>
            </section>

            <!-- Chart Section -->
            <section class="chart-section">
                <h2>Spending by Category</h2>
                <div class="chart-container">
                    <canvas id="expense-chart"></canvas>
                </div>
            </section>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
